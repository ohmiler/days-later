; How each motorbike model rides. The section name is the model (see
; StreetProp.BIKE_MODELS for how common each is and how it looks).
;   name     what players see
;   speed    top speed, pixels a second (walking is 55, sprinting about 95)
;   accel    how fast it picks up speed (pixels a second, each second)
;   fuel     a full tank, in litres (a battery, for the electric one)
;   use      litres a second at full speed (idling uses a tenth of that)
;   noise    how far away zombies hear the engine, in pixels
;   hp       how much knocking about it takes before it won't go
;   offroad  true: no slower on grass and dirt
;   electric true: a battery, so no petrol in it

