; What can be made by hand, one [section] per recipe (the section name is its id).
;   name    what the bag's craft list calls it (defaults to the result's name)
;   needs   what it uses up: {"item id": how many}. "#tag" takes any material
;           with that tag (see data/items.cfg), e.g. {"#cloth": 2}
;   makes   the item it makes
;   count   how many (default 1)
;   time    seconds of standing still to make it (default 2)
; Making things is not silent: nearby zombies may hear it.

[bandage]
needs={"rag": 2}
makes="bandage"
time=1.5

[nailbat_plank]
name="ไม้ตอกตะปู (จากไม้หน้าสาม)"
needs={"plank": 1, "nails": 3}
makes="nailbat"
time=3.0

[nailbat_wood]
name="ไม้ตอกตะปู (จากไม้กระดาน)"
needs={"wood": 1, "nails": 3, "tape": 1}
makes="nailbat"
time=3.5

[spikes]
needs={"wood": 1, "nails": 4}
makes="spikes"
time=3.0

[magarmor]
needs={"magazine": 3, "tape": 2}
makes="magarmor"
time=4.0

[schoolbag]
name="ย่ามผ้า (กระเป๋านักเรียน)"
needs={"rag": 5, "tape": 1}
makes="schoolbag"
time=5.0

[plank]
needs={"wood": 2, "nails": 2}
makes="plank"
time=2.5

[wire]
needs={"scrap": 2, "nails": 2}
makes="wire"
time=3.0
