; Victory Monument (อนุสาวรีย์ชัยสมรภูมิ), after the real one (layout from
; OpenStreetMap), squeezed about 2.5 times and turned so Phahon Yothin runs
; straight up (in real life the crossing is turned 30 degrees).
; Cells are about a metre; x runs east, y south. See data/zones/README.txt.

[plan]
size=[400, 320]
spawn=[191, 176]

; Streets: [x, y, w, h] in cells (running along the longer side), with a name.
roads=[
	{"rect": [193, 0, 14, 136], "name": "ถนนพหลโยธิน", "median": true},
	{"rect": [193, 184, 14, 136], "name": "ถนนพญาไท", "median": true},
	{"rect": [0, 153, 176, 14], "name": "ถนนราชวิถี", "median": true},
	{"rect": [224, 153, 176, 14], "name": "ถนนราชวิถี", "median": true},
	{"rect": [276, 167, 10, 153], "name": "ถนนราชปรารภ"},
	{"rect": [236, 220, 8, 100], "name": "ซอยรางน้ำ"},
	{"rect": [207, 214, 37, 6], "name": "ซอยรางน้ำ"},
	{"rect": [60, 220, 133, 8], "name": "ถนนโยธี"}
]
; Where streets meet (for the zebra crossings), apart from the roundabout.
junctions=[[276, 153, 10, 14], [236, 214, 8, 6], [193, 220, 14, 8]]

; The roundabout: its middle, the road's outer radius, the island's radius.
circle={"at": [200, 160], "r": 28, "island": 12}

; Khlong Sam Sen across the top (rows y .. y + h), bridged where the road crosses.
canals=[{"y": 16, "h": 6, "name": "คลองสามเสน"}]

; The skytrain: up Phahon Yothin over the middle of the road, round the east
; side of the roundabout, down Phaya Thai; the station just south of it.
bts={"x": 200, "around": 36, "station": [196, 214]}

; What each block is (for now every block is shophouses and sois; later the
; hospitals, malls and offices get their own buildings). A block runs right
; up to the pavements (two cells either side of a street); shophouses that
; would stand on the roundabout are left out. The bottom three rows of the
; map are pavement (shop fronts face south, onto it).
blocks=[
	{"rect": [0, 24, 191, 127], "use": "military_hospital", "name": "โรงพยาบาลทหาร"},
	{"rect": [0, 169, 191, 49], "use": "hospital", "name": "ย่านโรงพยาบาล"},
	{"rect": [0, 230, 191, 87], "use": "shophouses"},
	{"rect": [209, 24, 191, 127], "use": "office", "name": "ออฟฟิศ คอนโด"},
	{"rect": [209, 169, 65, 43], "use": "mall", "name": "ห้าง"},
	{"rect": [209, 222, 25, 95], "use": "mall", "name": "ห้าง"},
	{"rect": [246, 222, 28, 95], "use": "market", "name": "ซอยรางน้ำ"},
	{"rect": [288, 169, 112, 148], "use": "shophouses"}
]

; Ways out to other zones: the edge it's on, the street's cells at the edge,
; where it goes (a zone not made yet: a sign, but no way through).
exits=[
	{"id": "north", "edge": "north", "rect": [193, 0, 14, 3], "to": "saphankhwai", "to_exit": "south"},
	{"id": "south", "edge": "south", "rect": [193, 317, 14, 3], "to": "ratchathewi", "to_exit": "north"},
	{"id": "west", "edge": "west", "rect": [0, 153, 3, 14], "to": "ratchawithi", "to_exit": "east"},
	{"id": "east", "edge": "east", "rect": [397, 153, 3, 14], "to": "dindaeng", "to_exit": "west"},
	{"id": "ratchaprarop", "edge": "south", "rect": [276, 317, 10, 3], "to": "pratunam", "to_exit": "north"}
]
