; The bosses: one of a kind, each at home in a kind of big building, waiting
; among the shut-in dead (Survival lets them out together). One row each; the
; section name is the id, and a zombie kind of the same name in Zombie.KINDS
; says how fast, how tough and how hard it hits (and `armour`: the share of
; any blow below the head its gear stops).
;
; Order matters: a boss's id on the wire comes from its place in this file.
; Append new ones at the end.
;
;   name      what players see over the health bar
;   building  the kind of big building it lives in (hospital, mall, market, office)
;   hint      said the first time you see it: how to beat it
;   story     a line of why it's there
;   respawn   game hours after it's killed before another takes its place
;   wear      slot -> item it has on ("id#variant" for a look)
;   drops     item -> how many, handed to EVERY survivor who hurt it (their own)
;   xp        skill -> experience, for each of them too

[sergeant]
name="จ่าหน่วยกักกัน"
building="hospital"
hint="ใส่เกราะทั้งตัว ตีตัวแทบไม่เข้า: เล็งหัว"
story="ทหารที่ถูกส่งมาปิดโรงพยาบาล แล้วติดเชื้อเสียเองอยู่ข้างใน"
respawn=48.0
wear={"body": "army_shirt", "over": "vest", "face": "gasmask", "head": "bucket#27", "legs": "cargo#21", "feet": "boots"}
drops={"armyknife": 1}
xp={"combat": 400}

[chief]
name="ผู้กำกับสถานี"
building="police"
hint="เกราะกันกระสุน ตีตัวไม่เข้า: เล็งหัว หรือหนีไปให้ไกล แล้วค่อยกลับมา"
story="คนสุดท้ายที่ยังเฝ้าสถานี จนกระสุนหมดและติดเชื้อเองในห้องทำงาน"
respawn=72.0
wear={"body": "guard_shirt", "over": "vest", "head": "helmet", "legs": "cargo#21", "feet": "boots", "neck": "whistle"}
