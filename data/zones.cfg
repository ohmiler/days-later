; The zones of the city: one map each, loaded on its own (see Zones).
; The section name is the zone's id: saves use it, so don't rename one.
;
;   name    what players see
;   plan    a hand-drawn zone (data/zones/*.cfg: its size, streets, exits...);
;           without one the zone is laid out from the town section
;   size    [width, height] in cells (a cell is about a metre), a multiple of
;           the town section, 160 x 120 (zones without a plan)
;   todo    a zone not made yet: named on signs, but no way through
;   port    the port its own server listens on, when zones run as separate
;           servers (a dedicated server started with --zone=<id>)
;   exits   ways out (zones without a plan): {id, to, to_exit}. The id is
;           which edge of the map it's on (east, west, north, south), on the
;           avenue across the middle; `to` is the zone it leads to and
;           `to_exit` the way in on the other side.
;
; The first zone is where new survivors start.

[victory]
name="อนุสาวรีย์ชัย"
plan="res://data/zones/victory.cfg"
port=9080

[pratunam]
name="ประตูน้ำ"
size=[320, 240]
port=9081
exits=[{"id": "north", "to": "victory", "to_exit": "ratchaprarop"}]

; Zones still to come: named so the signs on the way out can say where it
; goes, but with no map yet (no way through).
[saphankhwai]
name="สะพานควาย"
todo=true

[ratchathewi]
name="ราชเทวี"
todo=true

[ratchawithi]
