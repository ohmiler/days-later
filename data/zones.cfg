; The zones of the city: one map each, loaded on its own (see Zones).
; The section name is the zone's id: saves use it, so don't rename one.
;
;   name    what players see
;   size    [width, height] in cells (a cell is about a metre); for now a
;           multiple of the town section, 160 x 120
;   port    the port its own server listens on, when zones run as separate
;           servers (a dedicated server started with --zone=<id>)
;   exits   ways out: {id, to, to_exit}. The id is which edge of the map the
;           way out is on (east, west, north, south), on the avenue across
;           the middle; `to` is the zone it leads to and `to_exit` the way
;           in on the other side.
;
; The first zone is where new survivors start.

[victory]
name="อนุสาวรีย์ชัย"
size=[320, 240]
port=9080
exits=[{"id": "east", "to": "pratunam", "to_exit": "west"}]

[pratunam]
name="ประตูน้ำ"
size=[320, 240]
port=9081
exits=[{"id": "west", "to": "victory", "to_exit": "east"}]
