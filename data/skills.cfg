; What a survivor gets better at by doing it (see Skills). One [section] per
; skill; the section name is the skill's id: saves refer to it, never rename one.
;
;   name     what players see
;   icon     the shape drawn for it (Skills.draw_icon)
;   xp       experience for each thing done: {"what": amount} (the code
;            names the "what" where it calls Skills.gain)
;   per_level  what each level changes, as a fraction: {"key": 0.005} is
;            0.5% a level (25% at level 50). Keys are read where it matters:
;            see Skills.mult.
;   unlocks  what opens at a level: {"5": "text"} (round 2 makes them do things)
;
; Levels 1-50. Experience to reach a level: Skills.xp_for (quick at first,
; slow later). The survivor level shown by your name is every level gained,
; added up, from 1 (Skills.total).

