; Things that happen in the city now and then (see Events): a sound from
; somewhere that draws the dead, sometimes with something to be had at the
; other end of it. One event at a time, every few minutes, near a survivor.
; The section name is the event's id.
;
;   name     what it is
;   type     sound: a sound from `where`, every `every` seconds for `seconds`,
;            the dead hear it `radius` px round; spawn: something turns up
;   when     day, night or any
;   where    street (a road), store (a minimart), home (a shophouse)
;   sound    a sound in audio/sfx or made in code (Sfx)
;   drift    (street) px a second it moves along the road
;   reach    a survivor this close to the source ends it, with `reward`
;   reward   item -> how many
;   weight   how often, against the others
;   hear     what the nearest survivor hears of it

[icecream]
name="รถไอติม"
type="sound"
when="day"
where="street"
sound="jingle"
every=5.0
seconds=70.0
radius=300.0
drift=14.0
weight=3
hear="แว่วเสียงเพลงรถไอติมลอยมาตามถนน ฝูงซอมบี้กำลังเดินตามเสียงไป"

