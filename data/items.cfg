; Every item in the game, one [section] per item. The section name is the
; item's id: saves and code refer to it, so never rename one that exists.
; To add an item, copy a section like it and change what differs.
;
; Every item has:
;   name     what players see
;   type     weapon / gun / ammo / use / trap / material / wear / junk
;   weight   kilograms; a survivor carries CARRY kg before slowing down
;   rarity   common / uncommon / rare: how often searching turns it up
;   places   kinds of place it is found in: store, med, food, tools,
;            valuables, clothes, home, barber, phone  (leave out for "never found")
;   tags     what it is, for rules that care: blade, sever, blunt, food,
;            drink, medicine, liquid...  Rules check tags, not ids.
;   icon     how it looks in the bag (use/trap/material/junk): a shape from
;            Items.ICONS and its colours. Weapons and clothes use `draw`.
; Optional:
;   stack    how many share one slot (default 1)
;   salvage  what taking it apart gives: {"rag": 2}
;   repair   the material that mends it (a weapon or clothes), e.g. "rag"
;   leaves   what's left after using it up (a "use" item): "bottle"
;   holds    sips of water it can carry (a bottle, a pot): filled at a tap,
;            from the canal, boiled on a stove (see Items.LIQUIDS); F drinks
;   spoil    game hours it keeps before it goes off (cooked food)
;   cooks    cooked on a stove in a pot: {"into": item, "water": sips, "n": how many}
;
; Tags with rules of their own: throw (T throws it: see Combat.req_throw),
;   glass (thrown, it smashes: louder, and gone), fire (lights things).
;
; Weapons:  range, dmg, cd (cooldown), stun, knock, dur (swing time),
;           hp (durability), cleave (hits everything in front),
;           death (how a zombie killed by it falls: style = chance),
;           silent (sneaking up behind one, it kills without a sound: Combat.backstab),
;           draw (see Look._draw_weapon)
; Use:      heal, food, drink (can be negative), cure, stop_bleed, stamina,
;           splint (mends a sprain), condition (brings on a Body.CONDITIONS),
;           blow (a whistle: using it calls the zombies around)
; Wear:     slot (head/body/over/legs/feet/back; "over" goes on top of
;           what is on "body": a vest over a shirt), armor (share of a bite stopped),
;           hp, speed (move multiplier), bag (extra slots), carry (extra kg),
;           draw (see Look), hot (how much it heats you), noise (footsteps
;           this much louder: rubber boots), glow (seen this much further in
;           the dark: hi-vis), punch (fists hit this much harder: boxing
;           gloves), no_grip (can't hold a weapon with them on), looks (one
;           item, many faces: see the wardrobe below). Slots also: face, neck,
;           arms, hands, knees, strap, waist.
; Colours are written as hex strings: "c8a878".

