; Quests (see Quests). One [section] per quest; the section name is its id:
; saves refer to it, never rename one. To add a quest, copy one like it.
;
;   name        the title shown over its objectives
;   desc        a line of why (the story of it)
;   objectives  what to do, each {"do": ..., "n": how many, "text": what it says}
;               plus, for some, what it has to be:
;                 kill          a zombie killed ("kind": "runner"... to count one kind only)
;                 kill_head     killed with a blow or shot to the head
;                 silent_kill   killed silently from behind
;                 have_tag      carrying things with a tag ("tag": "food") - counted as you go
;                 have_item     carrying an item ("item": "bandage")
;                 hold_weapon   something in your hand to fight with
;                 board         a door or window boarded up (or mended)
;                 craft         something made ("item": ... for one thing only)
;                 search        a cupboard, shelf, fridge... searched
;                 cook / boil   rice cooked / water boiled on a stove
;                 treat         a wound dressed
;                 eat / drink   something eaten / drunk
;                 dawn          alive at first light, having been out through the night
;   reward      {"xp": {"skill": amount}, "items": {"id": how many}}
;   next        the quest that starts when this one is done
;   daily       true: one of the everyday tasks (two a day once the start is done)
;   first       true: the one a new survivor starts with

; --- The start: learning to stay alive -------------------------------------

[intro_supplies]
first=true
name="ของกินของดื่ม"
desc="วันที่สามหลังเชื้อระบาด ไฟยังติด น้ำยังไหล แต่ร้านแถวนี้ถูกทิ้งร้างหมดแล้ว"
objectives=[{"do": "have_tag", "tag": "food", "n": 1, "text": "มีของกินติดกระเป๋า"}, {"do": "have_tag", "tag": "drink", "n": 1, "text": "มีน้ำดื่มติดกระเป๋า"}]
reward={"xp": {"endurance": 15}, "items": {"bandage": 2}}
next="intro_weapon"

[intro_weapon]
name="อะไรก็ได้ที่ตีได้"
desc="มือเปล่าสู้พวกมันไม่ไหว ค้นตู้ ค้นบ้าน หาไม้ ท่อ มีด อะไรก็ได้"
objectives=[{"do": "hold_weapon", "n": 1, "text": "ถืออาวุธไว้ในมือ"}]
reward={"xp": {"combat": 20}}
next="intro_kill"

[intro_kill]
name="ลองมือ"
desc="พวกมันช้า แต่มาเป็นกลุ่ม ตีหัวจะจบเร็ว เตะให้ล้มก่อนก็ได้"
objectives=[{"do": "kill", "n": 3, "text": "ฆ่าซอมบี้"}]
reward={"xp": {"combat": 30}, "items": {"water": 1}}
next="intro_board"

[intro_board]
name="ปิดบ้านให้แน่น"
desc="คืนนี้จะมีพวกมันเดินผ่าน หาไม้กระดาน (แยกชิ้นส่วนเฟอร์นิเจอร์ได้) แล้วตอกปิดประตูหรือหน้าต่าง กด R"
objectives=[{"do": "board", "n": 1, "text": "ตอกไม้ปิดประตูหรือหน้าต่าง"}]
reward={"xp": {"craft": 30}, "items": {"nails": 3}}
next="intro_silent"

[intro_silent]
name="เงียบไว้"
desc="เสียงดึงพวกมันมา ถือมีดหรือมีดพร้า กด C ย่องไปข้างหลังตัวที่ยังไม่เห็นเรา รอให้มีดเหนือหัวเป็นสีเหลือง แล้วคลิก"
objectives=[{"do": "silent_kill", "n": 1, "text": "ฆ่าเงียบจากข้างหลัง"}]
reward={"xp": {"stealth": 40}}
next="intro_night"

[intro_night]
name="คืนแรก"
desc="กลางคืนพวกมันมองไม่ค่อยเห็น แต่เราก็เหมือนกัน อยู่ในที่ปลอดภัย หรือนอนบนเตียงให้ข้ามคืน"
objectives=[{"do": "dawn", "n": 1, "text": "รอดจนถึงเช้า"}]
reward={"xp": {"endurance": 30, "medic": 20}, "items": {"firstaid": 1}}

; --- Everyday tasks: two a day, once the start is done ------------------

[daily_hunt]
daily=true
name="เคลียร์ซอย"
desc="ยิ่งแถวบ้านเงียบ คืนนี้ยิ่งหลับสบาย"
objectives=[{"do": "kill", "n": 10, "text": "ฆ่าซอมบี้"}]
reward={"xp": {"combat": 60}}

[daily_heads]
daily=true
name="ตีให้ถูกที่"
desc="ตีหัวทีเดียวจบ ประหยัดแรง"
objectives=[{"do": "kill_head", "n": 4, "text": "ฆ่าด้วยการตีหัว"}]
reward={"xp": {"combat": 50}}

[daily_runners]
daily=true
name="ตัวที่วิ่งได้"
desc="พวกที่วิ่งไล่ทันคืออันตรายที่สุด จัดการก่อนมันจะเจอเรา"
objectives=[{"do": "kill", "kind": "runner", "n": 2, "text": "ฆ่าซอมบี้ตัววิ่ง"}]
reward={"xp": {"combat": 50, "endurance": 20}}

[daily_scavenge]
daily=true
name="หาเสบียง"
desc="ตู้ไหนยังไม่ได้ค้น ของยังอยู่"
objectives=[{"do": "search", "n": 6, "text": "ค้นตู้หรือชั้นวาง"}]
reward={"xp": {"endurance": 30}, "items": {"snack": 2}}

[daily_quiet]
daily=true
name="มือสังหารเงียบ"
desc="ไม่ต้องให้ใครได้ยิน"
objectives=[{"do": "silent_kill", "n": 2, "text": "ฆ่าเงียบจากข้างหลัง"}]
reward={"xp": {"stealth": 70}}

[daily_cook]
daily=true
name="ข้าวร้อน ๆ"
desc="ของกระป๋องกินทุกวันก็เบื่อ หาหม้อ ข้าวสาร น้ำ แล้วหุงบนเตาแก๊ส"
objectives=[{"do": "cook", "n": 1, "text": "หุงข้าว"}]
reward={"xp": {"cook": 50}, "items": {"rice_raw": 1}}

[daily_medic]
daily=true
name="ดูแลแผล"
desc="แผลที่ไม่พันจะอักเสบ"
objectives=[{"do": "treat", "n": 2, "text": "พันแผล"}]
reward={"xp": {"medic": 50}, "items": {"bandage": 2}}

[daily_fortify]
daily=true
name="เสริมบ้าน"
desc="ไม้แผ่นเดียวกันพวกมันไม่อยู่"
objectives=[{"do": "board", "n": 2, "text": "ตอกไม้เสริมประตูหน้าต่าง"}]
reward={"xp": {"craft": 50}}
